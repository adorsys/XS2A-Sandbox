Change dependencies versions (E2E):
  extends: .sandbox-version-control-e2e

Change dependencies versions (INTEG):
  extends: .sandbox-version-control-integ

Renovate Update:
  extends: .renovate-update

Notify Slack (Renovate):
  extends: .slack_notify_renovate
  variables:
    RENOVATE_BRANCH_PREFIX: "bugFix/issue-0001-"

Notify Slack (Remediation):
  extends: .slack_notify_remediation
  needs:
    - job: "Unified Remediation"
      optional: true

Notify Slack (security failure):
  extends: .slack-security-failure-notify
  needs:
    - job: "Security (owasp-dep-check - gate)"
      optional: true
    - job: "Security (npm audit - gate)"
      optional: true
    - job: "Security (cyclonedx - gate)"
      optional: true
    - job: "Trivy Filesystem Scan (gate)"
      optional: true
    - job: "Trivy Dockerfile Scan (gate)"
      optional: true
    - job: "SonarQube"
      optional: true

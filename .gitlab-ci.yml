Release snapshot artifacts (develop):
  extends: .maven-release-snapshot

Release snapshot artifacts (tags):
  extends: .maven-release-tags

clone_to_github:
  extends: .github-sync-token
  stage: "Clone to github"
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_TYPE != "security-scan" && ($CI_COMMIT_BRANCH =~ /release-6/ || $CI_COMMIT_BRANCH == "support-6.x")'
      when: always
    - when: never
  variables:
    GITHUB_USERNAME: adorsys
    GITHUB_REPOSITORY: adorsys/XS2A-Sandbox
    GITHUB_PROJECT_CLONE_VERSION: "6"

CycloneDX + OWASP (on push):
  extends: .cyclonedx-owasp-maven-settings
  rules: !reference [.feature-branch-security-only, rules]

Trivy Filesystem Scan (on push):
  extends: .trivy-fs
  before_script: []
  rules: !reference [.feature-branch-security-only, rules]

Trivy Dockerfile Scan (on push):

Lint (Dockerfiles):
  image: docker
  stage: "Lint"
  services:
    - docker:dind
  tags:
    - aws
  except:
    - schedules
    - support-14.x
    - master-14.x
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_DRIVER: overlay2
  script:
    - apk add make
    - echo "Run Dockerfiles lint"
    - make lint-dockerfiles

